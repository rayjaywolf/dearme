<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test Score Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap");
      body {
        font-family: "Inter", sans-serif;
      }

      input[type="number"]::-webkit-inner-spin-button,
      input[type="number"]::-webkit-outer-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
      input[type="number"] {
        -moz-appearance: textfield;
      }
    </style>
  </head>
  <body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md">
      <h1 class="text-3xl font-bold text-center text-gray-800 mb-6">
        Test Score Calculator
      </h1>

      <p class="text-center text-gray-600 mb-8">
        Total Questions: <span class="font-semibold text-gray-800">300</span>
      </p>

      <div class="space-y-6">
        <!-- Correct Answers -->
        <div>
          <label
            for="correct"
            class="block text-sm font-medium text-gray-700 mb-1"
          >
            Correct Answers (+1)
          </label>
          <div class="flex">
            <button
              id="correct-dec"
              type="button"
              class="inline-flex items-center px-4 py-3 bg-gray-200 text-gray-700 font-bold border border-gray-300 rounded-l-lg hover:bg-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 z-10"
            >
              -
            </button>
            <input
              type="number"
              id="correct"
              min="0"
              max="140"
              class="w-full px-4 py-3 border-t border-b border-gray-300 text-lg text-center focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 z-0 -ml-px"
              placeholder="e.g., 100"
            />
            <button
              id="correct-inc"
              type="button"
              class="inline-flex items-center px-4 py-3 bg-gray-200 text-gray-700 font-bold border border-gray-300 rounded-r-lg hover:bg-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 z-10 -ml-px"
            >
              +
            </button>
          </div>
        </div>

        <!-- Incorrect Answers -->
        <div>
          <label
            for="incorrect"
            class="block text-sm font-medium text-gray-700 mb-1"
          >
            Incorrect Answers (-0.25)
          </label>
          <div class="flex">
            <button
              id="incorrect-dec"
              type="button"
              class="inline-flex items-center px-4 py-3 bg-gray-200 text-gray-700 font-bold border border-gray-300 rounded-l-lg hover:bg-gray-300 focus:outline-none focus:ring-2 focus:ring-red-500 z-10"
            >
              -
            </button>
            <input
              type="number"
              id="incorrect"
              min="0"
              max="300"
              class="w-full px-4 py-3 border-t border-b border-gray-300 text-lg text-center focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-red-500 z-0 -ml-px"
              placeholder="e.g., 20"
            />
            <button
              id="incorrect-inc"
              type="button"
              class="inline-flex items-center px-4 py-3 bg-gray-200 text-gray-700 font-bold border border-gray-300 rounded-r-lg hover:bg-gray-300 focus:outline-none focus:ring-2 focus:ring-red-500 z-10 -ml-px"
            >
              +
            </button>
          </div>
        </div>

        <!-- Error Message -->
        <div
          id="error-message"
          class="text-red-600 text-sm font-medium h-5"
        ></div>

        <hr class="border-gray-200" />

        <!-- Results -->
        <div class="space-y-4">
          <div
            class="flex justify-between items-center bg-gray-50 p-4 rounded-lg"
          >
            <span class="text-gray-600 font-medium">Unattempted (0)</span>
            <span id="unattempted" class="text-2xl font-semibold text-gray-800"
              >0</span
            >
          </div>

          <div
            class="flex justify-between items-center bg-blue-50 p-6 rounded-lg"
          >
            <span class="text-blue-800 font-bold text-lg"
              >Your Total Score</span
            >
            <span id="score" class="text-4xl font-bold text-blue-600"
              >0.00</span
            >
          </div>
        </div>
      </div>
    </div>

    <script>
      const correctInput = document.getElementById("correct");
      const incorrectInput = document.getElementById("incorrect");
      const unattemptedDisplay = document.getElementById("unattempted");
      const scoreDisplay = document.getElementById("score");
      const errorMessage = document.getElementById("error-message");

      const correctIncBtn = document.getElementById("correct-inc");
      const correctDecBtn = document.getElementById("correct-dec");
      const incorrectIncBtn = document.getElementById("incorrect-inc");
      const incorrectDecBtn = document.getElementById("incorrect-dec");

      const totalQuestions = 300;

      function calculateScore() {
        let correct = parseInt(correctInput.value) || 0;
        let incorrect = parseInt(incorrectInput.value) || 0;

        if (correct < 0) {
          correct = 0;
          correctInput.value = 0;
        }
        if (incorrect < 0) {
          incorrect = 0;
          incorrectInput.value = 0;
        }

        if (correct + incorrect > totalQuestions) {
          errorMessage.textContent =
            "Total correct and incorrect cannot exceed 300.";
          unattemptedDisplay.textContent = "...";
          scoreDisplay.textContent = "...";
        } else {
          errorMessage.textContent = "";

          const unattempted = totalQuestions - correct - incorrect;
          const score = correct * 1 - incorrect * 0.25;

          unattemptedDisplay.textContent = unattempted;
          scoreDisplay.textContent = score.toFixed(2);
        }
      }

      correctInput.addEventListener("input", calculateScore);
      incorrectInput.addEventListener("input", calculateScore);

      correctIncBtn.addEventListener("click", () => {
        let correct = parseInt(correctInput.value) || 0;
        let incorrect = parseInt(incorrectInput.value) || 0;
        if (correct + incorrect < totalQuestions) {
          correctInput.value = correct + 1;
          calculateScore();
        }
      });

      correctDecBtn.addEventListener("click", () => {
        let val = parseInt(correctInput.value) || 0;
        if (val > 0) {
          correctInput.value = val - 1;
          calculateScore();
        }
      });

      incorrectIncBtn.addEventListener("click", () => {
        let correct = parseInt(correctInput.value) || 0;
        let incorrect = parseInt(incorrectInput.value) || 0;
        if (correct + incorrect < totalQuestions) {
          incorrectInput.value = incorrect + 1;
          calculateScore();
        }
      });

      incorrectDecBtn.addEventListener("click", () => {
        let val = parseInt(incorrectInput.value) || 0;
        if (val > 0) {
          incorrectInput.value = val - 1;
          calculateScore();
        }
      });

      calculateScore();
    </script>
  </body>
</html>
